<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dự Án Lập Trình Web Đáp Ứng</title>
  <link rel="stylesheet" href="project.css">
</head>
<body>

  <a href="#main-content" class="skip-link">Chuyển đến nội dung chính</a>

  <header>
    <h1>Bộ Bộ Cập Nhật Ẩm Thực Việt Nam</h1>
  </header>

  <main id="main-content">
    <div class="grid-container">
      <figure>
        <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=500" alt="Bát phở bò truyền thống tỏa khói nghi ngút với hành lá">
        <figcaption>
          <h3>Phở Bò Hà Nội</h3>
          <p>Món ăn quốc hồn quốc túy với nước dùng đậm đà từ xương ống ninh trong nhiều giờ.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1599487488170-d11ec9c172f0?w=500" alt="Mẹt bún chả nướng than hoa ăn kèm rau sống và nước chấm">
        <figcaption>
          <h3>Bún Chả Hà Thành</h3>
          <p>Sự kết hợp hoàn hảo giữa thịt nướng thơm lừng và nước chấm chua ngọt đặc trưng.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1625398407796-82650a8c135f?w=500" alt="Bát phở gà xé phay rắc lá chanh tươi thái sợi">
        <figcaption>
          <h3>Phở Gà Lá Chanh</h3>
          <p>Hương vị thanh nhẹ, thịt gà dai ngọt ăn kèm với lá chanh thái sợi thơm nức.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1565299585323-38d6b0865b47?w=500" alt="Bánh mì Việt Nam kẹp thịt chả và rau dưa">
        <figcaption>
          <h3>Bánh Mì Sài Gòn</h3>
          <p>Món ăn đường phố nổi tiếng toàn cầu với vỏ giòn rụm và nhân đầy đặn.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500" alt="Tô bún bò Huế cay nồng với giò heo và chả cua">
        <figcaption>
          <h3>Bún Bò Huế</h3>
          <p>Món ăn đậm đà xứ Huế với vị cay nồng đặc trưng của sả và mắm ruốc.</p>
        </figcaption>
      </figure>
    </div>
  </main>
